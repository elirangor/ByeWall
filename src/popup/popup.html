<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Critical: Load dark mode script before anything else renders -->
  <link rel="preload" href="popup-early.js" as="script">
  <script src="popup-early.js"></script>

  <meta name="color-scheme" content="dark light">
  <title>Archive Article</title>

  <!-- Fonts (non-blocking, no inline onload) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontLink" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" media="print">

  <!-- Styles -->
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header-container">
    <h3>Page Rewind 📰</h3>
    <div class="toggle-container">
      <label class="toggle-switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="options-section">
    <label>
      <input type="radio" id="archiveTodayRadio" name="archiveService" value="archiveToday" checked />
      Archive.Today
    </label>
    <label>
      <input type="radio" id="waybackRadio" name="archiveService" value="wayback" />
      Wayback Machine
    </label>
  </div>

  <button id="archive">Rewind This Page</button>

  <!-- History section - only shows when there is history -->
  <div id="history-section" style="margin-top: 12px; display: none;">
    <div class="history-header">
      <h4>Recently Viewed</h4>
      <button id="clearHistory" class="clear-history-btn">🗑️ Clear History</button>
    </div>
    <ul id="historyList" style="list-style-type: none; padding: 0; margin: 0;"></ul>
  </div>

  <!-- Tab behavior - moved below history section -->
  <div class="tab-behavior-section">
    <div class="tab-choice" id="tabChoice">
      <div class="tab-option" data-value="new">➕ New Tab</div>
      <div class="tab-option" data-value="same">🔄 Same Tab</div>
    </div>
  </div>

  <!-- Modern keyboard shortcuts section -->
  <div class="shortcut-hint" id="shortcut-hint">
    <!-- Content will be dynamically generated by JavaScript -->
  </div>

  <div class="credit">
    <a href="https://www.linkedin.com/in/elirang/" target="_blank" rel="noopener noreferrer" title="Eliran on LinkedIn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
      </svg>
    </a>
    <a href="https://github.com/elirangor/ByeWall" target="_blank" rel="noopener noreferrer" title="View on GitHub">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
      </svg>
    </a>
    <a href="https://chromewebstore.google.com/detail/page-rewind/jagkfgieephkcbdhanohgfkeghfjnmcf" target="_blank"
      rel="noopener noreferrer" title="Get on Chrome Web Store">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">

          d="M12 0C8.21 0 4.831 1.757 2.632 4.501l3.953 6.848A5.454 5.454 0 0 1 12 6.545h10.691A12 12 0 0 0 12 0zM1.931 5.47A11.943 11.943 0 0 0 0 12c0 6.012 4.42 10.991 10.189 11.864l3.953-6.847a5.45 5.45 0 0 1-6.865-2.29zm13.342 2.166a5.446 5.446 0 0 1 1.45 7.09l.002.001h-.002l-5.344 9.257c.206.01.413.016.621.016 6.627 0 12-5.373 12-12 0-1.54-.29-3.011-.818-4.364zM12 10.545a1.455 1.455 0 1 0 0 2.91 1.455 1.455 0 0 0 0-2.91z" />

  </div>
  <div id="messageBox" class="message-box">
    <div class="message-box-content">
      <p id="messageText"></p>
      <div class="message-box-buttons">
        <button id="messageBoxClose">OK</button>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
